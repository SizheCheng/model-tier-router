[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "model-tier-router-dogfood"
version = "0.1.0"
description = "Private local harness for advisory model-tier-router dogfood"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mtr-dogfood = "mtr_dogfood.cli:main"
mtr-dogfood-evaluate-release = "mtr_dogfood.product_release:main"
mtr-dogfood-run-release-matrix = "mtr_dogfood.product_matrix:main"
mtr-dogfood-evaluate-readiness = "mtr_dogfood.product_readiness:main"
mtr-dogfood-codex-data = "mtr_dogfood.codex_app_enforcement:main"
mtr-dogfood-build-codex-enforcement = "mtr_dogfood.codex_app_bundle:main"

[tool.setuptools.packages.find]
where = ["src"]
